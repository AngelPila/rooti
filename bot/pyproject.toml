[project]
name = "rooti-bot"
version = "0.1.0"
description = "Rooti on WhatsApp: a farm-planning agent on Hermes Agent, adapted from Vinci"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "edge-tts==7.3.1"]

[project.optional-dependencies]
# The live call (call_server.py) runs in its own venv: Pipecat and WebRTC are heavy and the gateway never needs them.
call = ["pipecat-ai[webrtc,groq,deepseek,openai,silero]==1.16.0", "fastapi", "uvicorn"]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
rooti-bot = "rooti_bot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rooti_bot"]
