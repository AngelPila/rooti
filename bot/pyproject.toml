[project]
name = "rooti-bot"
version = "0.1.0"
description = "Rooti on WhatsApp: a farm-planning agent on Hermes Agent, adapted from Vinci"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "edge-tts==7.3.1", "fastapi", "uvicorn", "httpx"]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
rooti-bot = "rooti_bot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rooti_bot"]
